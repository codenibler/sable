[package]
name = "portfolio-1"
version = "0.1.0"
description = "A private, local-first portfolio monitor"
authors = ["Portfolio 1"]
edition = "2024"

[lib]
name = "portfolio_1_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"

