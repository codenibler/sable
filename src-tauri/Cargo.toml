[package]
name = "sable"
version = "0.1.0"
description = "A private, local-first portfolio monitor"
authors = ["Sable"]
edition = "2024"

[lib]
name = "sable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.4", features = ["json", "query"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
tokio = { version = "1.53.1", features = ["sync", "time"] }
bitcoin = "0.32.10"
futures-util = "0.3.33"
